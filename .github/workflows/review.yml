name: Code Review
on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
  issue_comment:
    types:
      - created # Triggers when a comment is created on a PR

permissions:
  pull-requests: write

jobs:
  setup-deepseek-review:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    name: Code Review
    steps:
      - name: DeepSeek Code Review
        uses: hustcer/deepseek-review@v1.21
        with:
          model: "deepseek-v4-pro"
          watch-mention: "@github-actions"
          chat-token: ${{ secrets.DEEPSEEK_TOKEN }}
          allowed-associations: "OWNER,MEMBER,COLLABORATOR"