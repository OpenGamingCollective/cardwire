name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write

jobs:
  Debian:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libbpf-dev libudev-dev pkg-config libxcb1-dev

      - name: Install gcc-multilib
        if: matrix.os == 'ubuntu-24.04'
        run: sudo apt-get install -y gcc-multilib

      - name: Fix missing asm/types.h on arm64
        if: matrix.os == 'ubuntu-24.04-arm'
        run: |
          sudo ln -s /usr/include/aarch64-linux-gnu/asm /usr/include/asm


      - name: Install Nightly Rust (for aya-ebpf)
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-12
          components: rust-src

      - name: Install Stable Rust
        uses: dtolnay/rust-toolchain@eac0f66a48bc4b70a10b9acd4c4e930f835d95ff # 1.95.0

      - name: Install bpf-linker
        # Build bpf-linker from source with the same nightly that emits the
        # bitcode: 0.10.x routes LLVM through aya-rustc-llvm-proxy, so the
        # linker's LLVM always matches the rustc that compiled it and trunk
        # bitcode links on every arch. Prebuilt binaries (taiki-e/install-action,
        # upstream release assets) pin their own LLVM and break against trunk
        # nightlies ("Invalid record" / "memset is not supported").
        run: cargo +nightly-2026-08-12 install --locked bpf-linker@0.10.4
      - name: Build cardwire
        run: |
          cargo install cargo-deb
          cargo deb -- --locked --config profile.release.lto=false

      - name: Find deb filename
        id: deb
        run: |
          DEB_FILE=$(basename target/debian/*.deb)
          echo "name=${DEB_FILE}" >> "$GITHUB_OUTPUT"

      - name: Upload deb
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.deb.outputs.name }}
          path: "target/debian/*.deb"
          if-no-files-found: error

  ArchLinux:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: |
          pacman -Sy git base-devel pacman-contrib rustup --noconfirm
      # The distro bpf-linker (0.11.0-1) links against stable llvm-libs and cannot
      # lower the trunk-LLVM bitcode emitted by the rustup nightly the PKGBUILD
      # builds with. Install bpf-linker from source with that same nightly
      # instead: 0.10.x routes LLVM through aya-rustc-llvm-proxy, so the linker's
      # LLVM always matches the rustc that compiled it. --root /usr/local shadows
      # /usr/bin/bpf-linker for every user; the PKGBUILD's makedepend is
      # satisfied by the distro package without it being used.
      - name: Install bpf-linker
        run: |
          rustup toolchain install nightly-2026-08-12 --component rust-src
          cargo +nightly-2026-08-12 install --locked bpf-linker@0.10.4 --root /usr/local
          /usr/local/bin/bpf-linker --version
      - name: Prepare PKGBUILD
        run: |
          mkdir /build
          cp packages/arch-linux/cardwire-PKGBUILD /build/PKGBUILD
          VERSION="${GITHUB_REF#refs/tags/v}"
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" /build/PKGBUILD
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/builder-pacman
          chmod 0440 /etc/sudoers.d/builder-pacman
          chown -R builder:builder /build
          cd /build
          su builder -c "updpkgsums"
      - name: Build package
        working-directory: /build
        run: |
          su builder -c "makepkg -s --noconfirm"

      - name: Find pkg filename
        id: pkg
        working-directory: /build
        run: |
          PKG_FILE=$(basename ./*.pkg.tar.zst)
          echo "name=${PKG_FILE}" >> "$GITHUB_OUTPUT"

      - name: Upload pkg
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: "/build/*.pkg.tar.zst"
          if-no-files-found: error

  Release:
    if: github.event_name == 'push'
    needs: [Debian, ArchLinux]
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4.2.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload assets and publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          files: |
            artifacts/*.deb
            artifacts/*.pkg.tar.zst
          fail_on_unmatched_files: true
