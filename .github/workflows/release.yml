---
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  Debian:
    name: Debian (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9  # v32.0.0
        with:
          extra_nix_config: |
            extra-substituters = https://cardwire.cachix.org
            extra-trusted-public-keys = cardwire.cachix.org-1:7+C7X4MVLz+IIQ/S0ZmMgEA/0ZL89kQytaUAA1cNLYA=
      - name: Build Debian package
        run: nix build .#debian
      - name: Find deb filename
        id: deb
        run: |
          DEB_FILE=$(basename result/*.deb)
          echo "name=${DEB_FILE}" >> "$GITHUB_OUTPUT"
      - name: Upload deb
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ steps.deb.outputs.name }}
          path: "result/*.deb"
          if-no-files-found: error
  ArchLinux:
    name: Arch Linux (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9  # v32.0.0
        with:
          extra_nix_config: |
            extra-substituters = https://cardwire.cachix.org
            extra-trusted-public-keys = cardwire.cachix.org-1:7+C7X4MVLz+IIQ/S0ZmMgEA/0ZL89kQytaUAA1cNLYA=
      - name: Build Arch package
        run: nix build .#archlinux
      - name: Find pkg filename
        id: pkg
        run: |
          PKG_FILE=$(basename result/*.pkg.tar.zst)
          echo "name=${PKG_FILE}" >> "$GITHUB_OUTPUT"
      - name: Upload pkg
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: "result/*.pkg.tar.zst"
          if-no-files-found: error
  Release:
    name: Release
    if: github.event_name == 'push'
    needs: [Debian, ArchLinux]
    runs-on: ubuntu-26.04
    permissions:
      contents: write  # action-gh-release publishes the release
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v4.2.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Upload assets and publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          draft: true
          files: |
            artifacts/*.deb
            artifacts/*.pkg.tar.zst
          fail_on_unmatched_files: true
