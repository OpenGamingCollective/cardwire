name: CICD
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      run_nix_vm: ${{ steps.files.outputs.run_nix_vm }}
      run_rust_checks: ${{ steps.files.outputs.run_rust_checks }}
      run_yaml_checks: ${{ steps.files.outputs.run_yaml_checks }}
      run_mdbook_check: ${{ steps.files.outputs.run_mdbook_check }}
    steps:
      - name: Determine changed files
        id: files
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: "const files = (await github.paginate(github.rest.pulls.listFiles, {\n  ...context.repo,\n  pull_number: context.payload.pull_request.number,\n  per_page: 100,\n})).map(file => file.filename)\n\nconst isDraft = context.payload.pull_request.draft;\n\nconst needsVMTest = !isDraft && files.some(file => \n  file.endsWith('.rs') || \n  file.includes('.nix') ||\n  file.includes('flake.lock') ||\n  file.includes('Cargo.toml') || \n  file.includes('Cargo.lock')\n);\n\nconst needsMdBookCheck = files.some(file => \n  file.startsWith('docs/')\n);\n\nconst needsRustQuality = files.some(file => \n  file.endsWith('.rs') ||\n  file.includes('Cargo.toml') || \n  file.includes('Cargo.lock')\n);\n\nif (needsVMTest) {\n  core.setOutput('run_nix_vm', 'true');\n}\nif (needsRustQuality) {\n  core.setOutput('run_rust_checks', 'true');\n}\nif (needsMdBookCheck) {\n  core.setOutput('run_mdbook_check', 'true');\n}\n"
  rust-lint:
    name: Rust Lint
    runs-on: ubuntu-latest
    needs: [prepare]
    permissions:
      contents: read
      pull-requests: read
      checks: write
    if: needs.prepare.outputs.run_rust_checks == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Remove preinstalled Rust
        run: rm -rf ~/.cargo ~/.rustup
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
      - name: Cargo Clippy
        run: nix develop .# --command just lint
  rust-test:
    name: Rust Test
    runs-on: ubuntu-latest
    needs: [prepare]
    permissions:
      contents: read
    if: needs.prepare.outputs.run_rust_checks == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Remove preinstalled Rust
        run: rm -rf ~/.cargo ~/.rustup
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
      - name: Cargo Test
        run: nix develop .# --command just test
  rust-format:
    name: Rust Format
    runs-on: ubuntu-latest
    needs: [prepare]
    permissions:
      contents: read
      pull-requests: write
    if: needs.prepare.outputs.run_rust_checks == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Remove preinstalled Rust
        run: rm -rf ~/.cargo ~/.rustup
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
      - name: Cargo Format
        run: nix develop .# --command just fmt-ci
  vm-test:
    name: VM Test (${{ matrix.vm }})
    runs-on: ubuntu-latest
    needs: [prepare]
    if: ${{ !failure() && !cancelled() && needs.prepare.outputs.run_nix_vm == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        vm: [vm-ci-2gpu, vm-ci-3gpu, vm-ci-15gpu]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: determinateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: cardwire
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - run: nix build .#checks.x86_64-linux.${{ matrix.vm }}
  mdbook-test:
    runs-on: ubuntu-latest
    needs: [prepare]
    if: needs.prepare.outputs.run_mdbook_check == 'true'
    env:
      MDBOOK_VERSION: 0.5.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
      - name: mdBook Test
        run: nix develop .# --command mdbook test
  yamlfmt:
    runs-on: ubuntu-latest
    needs: [prepare]
    if: needs.prepare.outputs.run_yaml_check == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
      - name: YAML format
        run: nix develop -c treefmt -f yamlfmt ./ --ci
  zizmor:
    runs-on: ubuntu-latest
    needs: [prepare]
    if: needs.prepare.outputs.run_yaml_check == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
      - name: Zizmor
        run: nix develop -c zizmor .github/ --format github -p
